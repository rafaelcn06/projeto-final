<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arena Multimarcas - Início</title>


  <!-- LINKS PARA FONTES  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Poppins:wght@700&display=swap" rel="stylesheet">

  <!-- LINKS PARA CSS -->
  <link rel="stylesheet" href="css/tokens/main.css">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components/navbar.css">
  <link rel="stylesheet" href="css/components/card.css">
  <link rel="stylesheet" href="css/components/form.css">
  <link rel="stylesheet" href="css/components/footer.css">
  <link rel="stylesheet" href="css/utilities.css">

  <style>

    /* JANELA DE LOGIN E CRIAÇÃO DE ANÚNCIO */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 999;
      justify-content: center;
      align-items: center;
    }
    .modal--open {
      display: flex;
    }
    .modal__backdrop {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: var(--color-overlay, rgba(0,0,0,0.6));
    }
    .modal__content {
      position: relative;
      background: var(--color-bg, #fff);
      padding: var(--space-lg);
      border-radius: var(--radius-md);
      width: 100%;
      max-width: var(--modal-max-width, 400px);
      max-height: 90vh;
      overflow-y: auto;
      scrollbar-width: thin;
      z-index: 1000;
    }
    .modal__close {
      position: absolute;
      top: var(--space-sm); right: var(--space-sm);
      background: transparent; border: none; font-size: var(--fs-lg);
    }
    .error-msg {
      color: var(--color-danger-500);
      font-size: var(--fs-sm);
      margin-bottom: var(--space-sm);
    }

    /*_____________________________________________________FINAL MODAIS_____________________________________________________*/


  </style>
</head>
<body>

<header class="header">
  <nav class="navbar">
    <div class="navbar__container">
      <a href="aula_03.html" class="navbar__logo">Arena Multimarcas</a>
      <button class="navbar__hamburger" id="hamburgerBtn" aria-label="Toggle navigation">
        <span class="navbar__hamburger-line"></span>
        <span class="navbar__hamburger-line"></span>
        <span class="navbar__hamburger-line"></span>
      </button>
      <ul class="navbar__menu" id="navbarMenu">
        <li class="navbar__item"><a href="aula_03.html" class="navbar__link">Home</a></li>
        <li class="navbar__item navbar__dropdown"> <!-- DROPDOWN DE CATEGORIAS -->
          <a href="#" class="navbar__link">Categorias</a>
          <ul class="navbar__submenu">
            <li><a href="camisetas.html" class="navbar__sublink">Camisetas</a></li>
            <li><a href="calcas.html" class="navbar__sublink">Calças</a></li>
            <li><a href="tenis.html" class="navbar__sublink">Tênis</a></li>
            <li><a href="relogios.html" class="navbar__sublink">Relógios</a></li>
            <li><a href="mochilas.html" class="navbar__sublink">Mochilas</a></li>
            <li><a href="departamento.html" class="navbar__sublink">Ver Todas</a></li>
          </ul>
        </li>
        <li class="navbar__item"><a href="ofertas.html" class="navbar__link">Ofertas</a></li>
      </ul>
      <div class="navbar__actions">
        <button id="createAdBtn" class="navbar__button hide">Criar Anúncio</button>
        <button id="loginTrigger" class="navbar__button">Login</button>
        <button id="cartButton" class="navbar__cart hide" aria-label="Carrinho">🛒</button>
        <span id="userBadge" class="navbar__user-badge hide">Visitante</span>
      </div>
    </div>
  </nav>
</header>

<main class="main">
  <section class="section">
    <h1 class="section__title">Destaques da Arena</h1>
    
    <div class="cards-grid">

    <!-- ESPAÇO PARA OS CARDS DE PRODUTOS QUE SERÃO EXIBIDOS VIA JAVASCRIPT -->

    </div>

  </section>
</main>

<footer class="footer">
  <div class="footer__inner">
    <p>Arena Multimarcas © <span id="footerYear"></span></p>
  </div>
</footer>


<!-- MODAL DE LOGIN / CRIAR ANÚNCIO -->

<!-- JANELA DE LOGIN -->
<div id="loginModal" class="modal" aria-hidden="true">
  <div class="modal__backdrop"></div>
  <div class="modal__content">
    <button id="closeLoginModal" class="modal__close">✖</button>
    <h2>Fazer Login</h2>
    <div id="loginError" class="error-msg"></div>
    <form id="loginForm" class="form">
      <div class="form__group">
        <label for="loginUser">Usuário (cliente ou admin)</label>
        <input type="text" id="loginUser" required>
      </div>
      <div class="form__group">
        <label for="loginPassword">Senha</label>
        <input type="password" id="loginPassword" required>
      </div>
      <button type="submit" class="card__button u-margin-top">Entrar</button>
    </form>
  </div>
</div>


<!-- JANELA DE CRIAÇÃO DE ANÚNCIO -->
<div id="createAdModal" class="modal" aria-hidden="true">
  <div class="modal__backdrop"></div>
  <div class="modal__content">
    <button id="closeCreateAdModal" class="modal__close">✖</button>
    <h2>Criar Novo Anúncio</h2>
    <div id="createAdError" class="error-msg"></div>
    <form id="createAdForm" class="form">
      <div class="form__group">
        <label>Título do Produto</label>
        <input type="text" name="title" required>
      </div>
      <div class="form__group">
        <label>Descrição</label>
        <textarea name="description" rows="2" required></textarea>
      </div>
      <div class="form__group">
        <label>Categoria</label>
        <select name="category" required>
          <option value="camisetas">Camisetas</option>
          <option value="calcas">Calças</option>
          <option value="tenis">Tênis</option>
          <option value="relogios">Relógios</option>
          <option value="mochilas">Mochilas</option>
        </select>
      </div>
      <div class="form__group">
        <label>Preço (R$)</label>
        <input type="number" name="price" step="0.01" required>
      </div>
      <div class="form__group">
        <label>Estoque Inicial</label>
        <input type="number" name="stock" required>
      </div>
      <div class="form__group">
        <label>URL da Imagem</label>
        <input type="url" name="imageUrl" placeholder="https://...">
      </div>
      <div class="form__group">
        <label>Ou anexe um arquivo (.jpg, .png)</label>
        <input type="file" name="imageFile" accept="image/png, image/jpeg">
      </div>
      <button type="submit" class="card__button u-margin-top">Salvar Anúncio</button>
    </form>
  </div>
</div>

<!--__________________________________________FINAL DA CRIAÇÃO DE LOGIN / ANÚNCIO____________________________________-->


<script src="js/main.js"></script> <!-- LINK PARA O JAVASCRIPT QUE CONTÉM TODA A LÓGICA DE INTERAÇÃO DO SITE -->
</body>
</html>
